<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B2F7A">
<title>Sabah GO Console</title>
<meta name="description" content="Government console for Sabah GO: KePKAS, Ministry of Finance Sabah, Immigration Sabah, merchants and operations on one platform.">
<link rel="icon" href="/img/logos/sabah-go-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/console.css?v=4">
<link rel="stylesheet" href="/css/glass.css?v=7">
</head>
<body>
<!-- moving backdrop: a slow drift on a photograph of Sabah, a flat navy scrim, and the logo's swoosh -->
<div class="bg" aria-hidden="true">
  <div class="bg-photo"></div><div class="bg-scrim"></div>
  <svg class="bg-sw" viewBox="0 0 1920 600" preserveAspectRatio="none">
    <path class="s2" d="M-100 470 C 300 360 640 520 980 430 S 1600 300 2020 400"/>
    <path class="s1" d="M-100 520 C 380 380 760 300 1180 340 S 1700 420 2020 280"/>
    <path class="s3" d="M-100 560 C 420 470 800 560 1200 480 S 1720 430 2020 500"/>
  </svg>
  <svg class="bg-plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
</div>
<section id="picker"></section>
<div id="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="scrim" id="scrim" onclick="closeAll()"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script src="/js/config.js?v=5"></script>
<script src="/js/engine.js?v=5"></script>
<script src="/js/ui.js?v=4"></script>
<script src="/js/records.js?v=6"></script>
<script src="/js/models.js?v=4"></script>
<script src="/js/reports.js?v=4"></script>
<script src="/js/reports-ui.js?v=4"></script>
<script src="/js/pages-ops.js?v=4"></script>
<script src="/js/sabah-geo.js?v=1"></script>
<script src="/js/pages-tourism.js?v=6"></script>
<script src="/js/pages-finance.js?v=4"></script>
<script src="/js/pages-immigration.js?v=4"></script>
<script src="/js/pages-merchant.js?v=4"></script>
<script src="/js/pages-command.js?v=4"></script>
<script src="/js/live.js?v=4"></script>
<script src="/js/motion.js?v=2"></script>
<script src="/js/boot.js?v=4"></script>
</body>
</html>
